[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-backtest"
version = "0.3.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "numba"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
twbacktest = "twbacktest.cli:main"
